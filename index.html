<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>专属恋人 · Secret Space</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="小Rae和小海胆的专属空间">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans SC"', 'sans-serif'],
            handwriting: ['Pacifico', 'cursive'],
          },
          colors: { rose: { 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af', 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48' } }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { display: none; }
    * { -webkit-tap-highlight-color: transparent; }
    @keyframes floatHeart {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-120px) scale(1.3); opacity: 0; }
    }
    .animate-float-heart { animation: floatHeart 1.5s ease-out forwards; }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 228, 230, 0.6);
    }
    .polaroid-shadow { box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="bg-rose-50/60 font-sans antialiased text-gray-800 min-h-screen flex justify-center selection:bg-rose-200">

  <div x-data="loveApp()" class="w-full max-w-md min-h-screen bg-gradient-to-b from-rose-100/40 via-white to-rose-50/50 flex flex-col relative pb-28 border-x border-rose-100/50 shadow-2xl">
    
    <!-- Header / Status Bar -->
    <header class="sticky top-0 z-30 glass-card px-5 py-3.5 flex items-center justify-between border-b border-rose-100/80">
      <div class="flex items-center space-x-3">
        <div>
          <h1 class="text-base font-bold text-gray-800 flex items-center gap-1">
            <span>小Rae和小海胆的专属空间</span>
            <i data-lucide="sparkles" class="w-4 h-4 text-rose-400"></i>
          </h1>
          <p class="text-xs text-rose-500 font-medium" x-text="partnerStatusText"></p>
        </div>
      </div>
      
      <div class="flex gap-2">
        <button @click="showNotifModal = true" class="relative p-2 rounded-full bg-rose-50 text-rose-500 hover:bg-rose-100 active:scale-95 transition-all">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span x-show="notifications.length > 0" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
        </button>
        <button @click="showDateModal = true" class="p-2 rounded-full bg-rose-50 text-rose-500 hover:bg-rose-100 active:scale-95 transition-all">
          <i data-lucide="calendar-heart" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <div class="fixed inset-0 pointer-events-none z-50" id="hearts-container"></div>

    <!-- ==================== TAB 1: 首页 & 恋爱倒计时 ==================== -->
    <main x-show="activeTab === 'home'" x-transition class="p-5 space-y-5">
      
      <div class="glass-card rounded-3xl p-6 text-center relative overflow-hidden shadow-xl shadow-rose-100/50 border border-white">
        <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-rose-200/40 rounded-full blur-2xl"></div>
        <div class="absolute -left-8 -top-8 w-32 h-32 bg-pink-200/40 rounded-full blur-2xl"></div>

        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-100/80 text-rose-600 mb-3">
          <i data-lucide="heart" class="w-3.5 h-3.5 fill-rose-500 text-rose-500 animate-pulse"></i>
          我们相爱已有
        </span>

        <div class="my-2">
          <span class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-pink-600" x-text="timer.totalDays"></span>
          <span class="text-lg font-bold text-rose-400 ml-1">天</span>
        </div>

        <div class="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-rose-100/60">
          <div class="bg-white/70 p-2.5 rounded-2xl shadow-sm border border-rose-50">
            <div class="text-xl font-bold text-gray-800" x-text="timer.hours"></div>
            <div class="text-[11px] text-gray-400">小时</div>
          </div>
          <div class="bg-white/70 p-2.5 rounded-2xl shadow-sm border border-rose-50">
            <div class="text-xl font-bold text-gray-800" x-text="timer.minutes"></div>
            <div class="text-[11px] text-gray-400">分钟</div>
          </div>
          <div class="bg-white/70 p-2.5 rounded-2xl shadow-sm border border-rose-50">
            <div class="text-xl font-bold text-rose-500 font-mono" x-text="timer.seconds"></div>
            <div class="text-[11px] text-gray-400">秒</div>
          </div>
        </div>
      </div>

      <!-- Interaction Button -->
      <div class="flex gap-3">
        <button @click="triggerLoveInteraction('hug')" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-rose-400 to-pink-500 text-white font-semibold shadow-lg shadow-rose-200 active:scale-95 transition-transform flex items-center justify-center gap-2">
          <span>给对方一个抱抱 🫂</span>
        </button>
      </div>

      <!-- Daily Love Quote Widget -->
      <div class="glass-card rounded-2xl p-4 relative shadow-sm border border-rose-100">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-rose-500 flex items-center gap-1">
            <i data-lucide="quote" class="w-3.5 h-3.5"></i> 每日浪漫情话
          </span>
          <button @click="nextQuote()" class="text-xs text-gray-400 hover:text-rose-500 flex items-center gap-0.5">
            <i data-lucide="refresh-cw" class="w-3 h-3"></i> 换一句
          </button>
        </div>
        <p class="text-sm text-gray-700 italic leading-relaxed" x-text="currentQuote"></p>
      </div>

      <!-- Milestone Countdown Cards -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-gray-700 flex items-center gap-1.5">
            <i data-lucide="flag" class="w-4 h-4 text-rose-500"></i>
            下一个纪念日倒计时
          </h3>
          <button @click="showMilestoneModal = true" class="text-xs text-rose-500 font-bold bg-rose-50 px-2 py-1 rounded-md">管理</button>
        </div>
        
        <div class="space-y-2.5">
          <template x-for="ms in milestones" :key="ms.id">
            <div class="glass-card p-3.5 rounded-2xl flex items-center justify-between shadow-sm">
              <div class="flex items-center space-x-3">
                <template x-if="!ms.image">
                  <div class="w-10 h-10 rounded-xl bg-rose-100 flex items-center justify-center text-rose-500 text-lg" x-text="ms.icon"></div>
                </template>
                <template x-if="ms.image">
                  <img :src="ms.image" class="w-10 h-10 rounded-xl object-cover border border-rose-200" />
                </template>
                <div>
                  <h4 class="text-sm font-bold text-gray-800" x-text="ms.title"></h4>
                  <p class="text-xs text-gray-400" x-text="ms.targetDate"></p>
                </div>
              </div>
              <div class="text-right">
                <span class="text-lg font-extrabold text-rose-500" x-text="calculateDaysLeft(ms.targetDate)"></span>
                <span class="text-xs text-gray-400">天后</span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </main>

    <!-- ==================== TAB 2: 专属点菜单 ==================== -->
    <main x-show="activeTab === 'menu'" x-transition class="p-5 space-y-4">
      
      <div class="bg-gradient-to-r from-rose-500 to-pink-500 rounded-3xl p-5 text-white shadow-xl shadow-rose-200 relative overflow-hidden">
        <div class="relative z-10 flex justify-between items-start">
          <div>
            <h2 class="text-xl font-extrabold mt-2">小Rae专属点单 💌</h2>
            <p class="text-xs text-rose-100 mt-1">选择你想让他为你做的事，一键下达订单！</p>
          </div>
          <button @click="showMenuEditModal = true" class="bg-white/20 text-white text-xs px-2 py-1 rounded-md backdrop-blur-sm">编辑菜单</button>
        </div>
        <i data-lucide="utensils-crossed" class="absolute right-3 -bottom-2 w-24 h-24 text-white/10"></i>
      </div>

      <!-- Categories Filter -->
      <div class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar">
        <template x-for="cat in menuCategories" :key="cat">
          <button 
            @click="activeMenuCategory = cat" 
            :class="activeMenuCategory === cat ? 'bg-rose-500 text-white shadow-md shadow-rose-200' : 'bg-white text-gray-600 border border-rose-100'"
            class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all active:scale-95">
            <span x-text="cat"></span>
          </button>
        </template>
        <button @click="activeMenuCategory = '今天想吃什么？'" 
          :class="activeMenuCategory === '今天想吃什么？' ? 'bg-orange-500 text-white shadow-md shadow-orange-200' : 'bg-orange-50 text-orange-600 border border-orange-200'"
          class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all active:scale-95 flex items-center gap-1">
          <i data-lucide="shopping-bag" class="w-3 h-3"></i> 今天想吃什么？
        </button>
      </div>

      <!-- Menu Items Grid -->
      <div x-show="activeMenuCategory !== '今天想吃什么？'" class="grid grid-cols-1 gap-3">
        <template x-for="item in filteredMenuItems" :key="item.id">
          <div class="glass-card rounded-2xl p-3.5 flex items-center justify-between border border-rose-100/80 shadow-sm">
            <div class="flex items-center space-x-3.5">
              <template x-if="!item.image">
                <div class="bg-rose-100 w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-inner">
                  <span x-text="item.icon"></span>
                </div>
              </template>
              <template x-if="item.image">
                <img :src="item.image" class="w-12 h-12 rounded-2xl object-cover shadow-sm">
              </template>
              <div>
                <h4 class="text-sm font-bold text-gray-800" x-text="item.name"></h4>
                <p class="text-xs text-gray-500 mt-0.5" x-text="item.desc"></p>
                <div class="mt-1 flex items-center gap-1.5">
                  <span class="text-[11px] font-semibold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-md" x-text="'代价: ' + item.price"></span>
                </div>
              </div>
            </div>
            <button @click="addToCart(item)" class="w-9 h-9 min-w-[36px] rounded-full bg-rose-500 text-white flex items-center justify-center shadow-md shadow-rose-200 active:scale-90 transition-transform">
              <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
          </div>
        </template>
      </div>

      <!-- Food Delivery UI -->
      <div x-show="activeMenuCategory === '今天想吃什么？'" class="grid grid-cols-2 gap-3">
        <template x-for="food in foodItems" :key="food.id">
          <div class="bg-white rounded-2xl p-2 border border-orange-100 shadow-sm relative">
            <img :src="food.image" class="w-full h-24 object-cover rounded-xl mb-2" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=400&q=80'">
            <h4 class="text-xs font-bold text-gray-800 truncate" x-text="food.name"></h4>
            <div class="flex justify-between items-center mt-1">
              <span class="text-xs font-bold text-orange-500" x-text="'¥' + food.price_num"></span>
              <button @click="addToCart(food)" class="w-6 h-6 rounded-full bg-orange-500 text-white flex items-center justify-center shadow-md active:scale-90">
                <i data-lucide="plus" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
        </template>
        <button @click="showAddFoodModal = true" class="bg-orange-50/50 rounded-2xl p-2 border border-dashed border-orange-300 flex flex-col items-center justify-center text-orange-500 min-h-[140px]">
          <i data-lucide="plus-circle" class="w-6 h-6 mb-1"></i>
          <span class="text-xs font-medium">添加菜品</span>
        </button>
      </div>

      <!-- Cart Bottom Floating Bar -->
      <div x-show="cart.length > 0" x-transition class="fixed bottom-20 left-4 right-4 max-w-md mx-auto z-30">
        <div class="bg-gray-900/90 backdrop-blur-xl text-white rounded-2xl p-3 px-4 flex items-center justify-between shadow-2xl border border-gray-700/50">
          <div class="flex items-center space-x-3">
            <div class="relative">
              <div class="w-10 h-10 rounded-xl bg-rose-500 flex items-center justify-center">
                <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
              </div>
              <span class="absolute -top-1.5 -right-1.5 bg-yellow-400 text-gray-900 font-extrabold text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-gray-900" x-text="cartTotalCount"></span>
            </div>
            <div>
              <div class="text-xs text-gray-300">已挑选卡片/菜品</div>
              <div class="text-sm font-bold text-rose-300" x-text="cartTotalCount + ' 个项目等待履约'"></div>
            </div>
          </div>
          <button @click="showCartModal = true" class="py-2 px-4 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 rounded-xl text-xs font-bold active:scale-95 transition-transform shadow-md shadow-rose-900/50">
            去结算
          </button>
        </div>
      </div>
    </main>

    <!-- ==================== TAB 3: 照片墙 ==================== -->
    <main x-show="activeTab === 'photos'" x-transition class="p-5 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-gray-800">甜蜜照片墙 📸</h2>
          <p class="text-xs text-gray-500">记录每一个闪闪发光的瞬间</p>
        </div>
        <button @click="showUploadModal = true" class="px-3 py-2 bg-rose-500 text-white rounded-xl text-xs font-semibold shadow-md flex items-center gap-1 active:scale-95 transition-transform">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 添加回忆
        </button>
      </div>

      <div class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar">
        <template x-for="cat in photoCategories" :key="cat">
          <button @click="activePhotoFilter = cat" :class="activePhotoFilter === cat ? 'bg-rose-500 text-white' : 'bg-white text-gray-600 border border-rose-100'" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all active:scale-95">
            <span x-text="cat"></span>
          </button>
        </template>
      </div>

      <div class="grid grid-cols-2 gap-3.5">
        <template x-for="(photo, index) in filteredPhotos" :key="photo.id">
          <div @click="openLightbox(photo)" class="bg-white p-2.5 rounded-2xl polaroid-shadow border border-rose-50 transform hover:-translate-y-1 transition-all cursor-pointer group">
            <div class="relative aspect-square rounded-xl overflow-hidden bg-rose-50">
              <img :src="photo.url" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <span class="absolute bottom-1.5 right-1.5 bg-black/50 backdrop-blur-md text-white text-[10px] px-2 py-0.5 rounded-md" x-text="photo.date"></span>
            </div>
            <div class="pt-2 px-1">
              <h4 class="text-xs font-bold text-gray-800 truncate" x-text="photo.title"></h4>
            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- ==================== TAB 4: 许愿池 ==================== -->
    <main x-show="activeTab === 'wishes'" x-transition class="p-5 space-y-5">
      <div class="glass-card rounded-3xl p-4 shadow-sm border border-rose-100">
        <h3 class="text-sm font-bold text-gray-800 mb-2 flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i> 许愿池 · 想和你一起完成的事
        </h3>
        <form @submit.prevent="addWish()" class="flex gap-2">
          <input type="text" x-model="newWishText" placeholder="写下一个浪漫的新愿望..." class="flex-1 bg-white border border-rose-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none text-gray-700">
          <button type="submit" class="bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md active:scale-95 whitespace-nowrap">扔进许愿池</button>
        </form>
      </div>

      <div class="space-y-2">
        <template x-for="wish in wishes" :key="wish.id">
          <div @click="toggleWish(wish.id)" :class="wish.completed ? 'bg-emerald-50/80 border-emerald-200' : 'bg-white border-rose-100'" class="p-3.5 rounded-2xl border shadow-sm flex items-center justify-between cursor-pointer transition-all">
            <div class="flex items-center space-x-3">
              <div :class="wish.completed ? 'bg-emerald-500 text-white' : 'border-2 border-gray-300 text-transparent'" class="w-5 h-5 rounded-full flex items-center justify-center transition-colors text-xs font-bold">✓</div>
              <span :class="wish.completed ? 'line-through text-gray-400' : 'text-gray-800 font-medium'" class="text-xs" x-text="wish.text"></span>
            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- ==================== FIXED BOTTOM NAVBAR ==================== -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-xl border-t border-rose-100 flex justify-around items-center py-2.5 z-40 rounded-t-3xl shadow-2xl">
      <button @click="switchTab('home')" :class="activeTab === 'home' ? 'text-rose-500 font-bold' : 'text-gray-400'" class="flex flex-col items-center gap-0.5">
        <i data-lucide="heart" class="w-5 h-5"></i><span class="text-[10px]">首页</span>
      </button>
      <button @click="switchTab('menu')" :class="activeTab === 'menu' ? 'text-rose-500 font-bold' : 'text-gray-400'" class="flex flex-col items-center gap-0.5 relative">
        <i data-lucide="utensils" class="w-5 h-5"></i><span class="text-[10px]">专属点单</span>
        <span x-show="cart.length > 0" class="absolute -top-1 right-2 w-2 h-2 bg-rose-500 rounded-full animate-ping"></span>
      </button>
      <button @click="switchTab('photos')" :class="activeTab === 'photos' ? 'text-rose-500 font-bold' : 'text-gray-400'" class="flex flex-col items-center gap-0.5">
        <i data-lucide="image" class="w-5 h-5"></i><span class="text-[10px]">回忆墙</span>
      </button>
      <button @click="switchTab('wishes')" :class="activeTab === 'wishes' ? 'text-rose-500 font-bold' : 'text-gray-400'" class="flex flex-col items-center gap-0.5">
        <i data-lucide="stars" class="w-5 h-5"></i><span class="text-[10px]">许愿池</span>
      </button>
    </nav>

    <!-- ==================== MODALS ==================== -->

    <!-- Notifications Modal -->
    <div x-show="showNotifModal" x-transition.opacity class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div @click.away="showNotifModal = false" class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl flex flex-col max-h-[70vh]">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-bold text-gray-800">消息通知 🔔</h3>
          <button @click="showNotifModal = false; notifications = []" class="text-xs text-rose-500">清空</button>
        </div>
        <div class="flex-1 overflow-y-auto space-y-3">
          <template x-if="notifications.length === 0">
            <p class="text-xs text-gray-400 text-center py-4">暂无新通知</p>
          </template>
          <template x-for="notif in notifications" :key="notif.id">
            <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
              <div class="flex justify-between">
                <span class="text-[10px] text-gray-500" x-text="notif.time"></span>
              </div>
              <p class="text-sm font-medium text-gray-800 mt-1" x-text="notif.text"></p>
            </div>
          </template>
        </div>
        <button @click="showNotifModal = false" class="mt-4 w-full py-2 bg-gray-100 text-gray-600 rounded-xl text-xs font-semibold">关闭</button>
      </div>
    </div>

    <!-- Edit Milestone Modal -->
    <div x-show="showMilestoneModal" x-transition.opacity class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 max-h-[80vh] overflow-y-auto">
        <h3 class="text-base font-bold text-gray-800 text-center">编辑倒计时</h3>
        <template x-for="(ms, index) in milestones" :key="ms.id">
          <div class="flex items-center justify-between border-b pb-2">
            <span class="text-xs font-bold" x-text="ms.title"></span>
            <button @click="milestones.splice(index, 1); saveMilestones()" class="text-red-500 text-xs">删除</button>
          </div>
        </template>
        <div class="bg-rose-50 p-3 rounded-xl space-y-2 mt-4">
          <input type="text" x-model="newMsTitle" placeholder="名称 (如：下次见面)" class="w-full text-xs p-2 rounded-lg border">
          <input type="date" x-model="newMsDate" class="w-full text-xs p-2 rounded-lg border">
          <input type="file" @change="handleIconUpload($event)" accept="image/*" class="w-full text-[10px]">
          <button @click="addMilestone()" class="w-full bg-rose-500 text-white text-xs py-2 rounded-lg">添加新倒计时</button>
        </div>
        <button @click="showMilestoneModal = false" class="w-full py-2 bg-gray-100 text-gray-600 rounded-xl text-xs font-semibold mt-2">关闭</button>
      </div>
    </div>

    <!-- Edit Menu Categories/Items Modal -->
    <div x-show="showMenuEditModal" x-transition.opacity class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 max-h-[80vh] overflow-y-auto">
        <h3 class="text-base font-bold text-gray-800 text-center">管理专属选项卡</h3>
        <div class="space-y-2">
          <template x-for="(cat, index) in menuCategories" :key="index">
            <div class="flex justify-between items-center text-xs bg-gray-50 p-2 rounded-lg">
              <span x-text="cat"></span>
              <button x-show="cat !== '全部'" @click="menuCategories.splice(index, 1); saveMenuData()" class="text-red-500">移除</button>
            </div>
          </template>
        </div>
        <div class="flex gap-2">
          <input type="text" x-model="newCategoryName" placeholder="新选项卡名称" class="flex-1 text-xs p-2 rounded-lg border">
          <button @click="if(newCategoryName) { menuCategories.push(newCategoryName); saveMenuData(); newCategoryName=''; }" class="bg-rose-500 text-white px-3 rounded-lg text-xs">新增</button>
        </div>
        
        <h4 class="text-sm font-bold mt-4 pt-4 border-t">添加新点单项</h4>
        <input type="text" x-model="newItem.name" placeholder="名称" class="w-full text-xs p-2 rounded-lg border">
        <select x-model="newItem.category" class="w-full text-xs p-2 rounded-lg border mt-2">
          <template x-for="cat in menuCategories.filter(c => c !== '全部')" :key="cat">
            <option :value="cat" x-text="cat"></option>
          </template>
        </select>
        <input type="text" x-model="newItem.price" placeholder="代价 (如：一个亲亲)" class="w-full text-xs p-2 rounded-lg border mt-2">
        <input type="file" @change="handleItemImageUpload($event)" accept="image/*" class="w-full text-[10px] mt-2">
        <button @click="addNewMenuItem()" class="w-full bg-rose-500 text-white text-xs py-2 rounded-lg mt-2">添加到菜单</button>

        <button @click="showMenuEditModal = false" class="w-full py-2 bg-gray-100 text-gray-600 rounded-xl text-xs font-semibold mt-4">完成</button>
      </div>
    </div>

    <!-- Add Food Modal -->
    <div x-show="showAddFoodModal" x-transition.opacity class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
        <h3 class="text-base font-bold text-gray-800 text-center">上架新外卖</h3>
        <input type="text" x-model="newFood.name" placeholder="菜品名称 (如：麦当劳套餐)" class="w-full text-xs p-2 rounded-lg border">
        <input type="number" x-model="newFood.price" placeholder="价格" class="w-full text-xs p-2 rounded-lg border">
        <input type="file" @change="handleFoodImageUpload($event)" accept="image/*" class="w-full text-[10px]">
        <div class="flex gap-2 pt-2">
          <button @click="showAddFoodModal = false" class="flex-1 py-2 bg-gray-100 text-gray-600 rounded-xl text-xs">取消</button>
          <button @click="addFoodItem()" class="flex-1 py-2 bg-orange-500 text-white rounded-xl text-xs">上架</button>
        </div>
      </div>
    </div>

    <!-- Date Configuration Modal -->
    <div x-show="showDateModal" x-transition.opacity class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl space-y-4">
        <h3 class="text-base font-bold text-gray-800 text-center">设置你们的纪念日 💕</h3>
        <div>
          <input type="date" x-model="tempDateValue" class="w-full bg-rose-50 border border-rose-200 rounded-xl p-2.5 text-xs text-gray-800 focus:outline-none">
        </div>
        <div class="flex gap-2 pt-2">
          <button @click="showDateModal = false" class="flex-1 py-2 bg-gray-100 text-gray-600 rounded-xl text-xs font-semibold">取消</button>
          <button @click="saveAnniversaryDate()" class="flex-1 py-2 bg-rose-500 text-white rounded-xl text-xs font-semibold shadow-md shadow-rose-200">保存更新</button>
        </div>
      </div>
    </div>

    <!-- Cart & Order Modal -->
    <div x-show="showCartModal" x-transition.opacity class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center">
      <div class="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
        <div class="flex items-center justify-between border-b border-gray-100 pb-3">
          <h3 class="text-base font-bold text-gray-800 flex items-center gap-2">点单清单</h3>
          <button @click="showCartModal = false" class="text-gray-400 hover:text-gray-600">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
          <template x-for="item in cart" :key="item.id">
            <div class="flex items-center justify-between bg-rose-50/50 p-3 rounded-2xl border border-rose-100">
              <div>
                <div class="text-xs font-bold text-gray-800" x-text="item.name"></div>
                <div class="text-[10px] text-rose-500" x-text="item.price ? '代价: '+item.price : '¥'+item.price_num"></div>
              </div>
              <div class="flex items-center space-x-2">
                <button @click="updateCartQty(item.id, -1)" class="w-6 h-6 rounded-full bg-white border flex items-center justify-center text-xs">-</button>
                <span class="text-xs font-bold text-gray-800" x-text="item.qty"></span>
                <button @click="updateCartQty(item.id, 1)" class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs">+</button>
              </div>
            </div>
          </template>
        </div>
        <div>
          <input type="text" x-model="orderNote" placeholder="留言/备注..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-xs text-gray-700">
        </div>
        <button @click="submitOrder()" class="w-full py-3 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-xl text-xs font-bold shadow-lg">确认下单 🚀</button>
      </div>
    </div>

    <!-- Receipt Modal -->
    <div x-show="showReceiptModal" x-transition.opacity class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center space-y-4 relative">
        <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-500 text-2xl mx-auto">✓</div>
        <h3 class="text-base font-bold text-gray-800">订单已发送！🎉</h3>
        <button @click="showReceiptModal = false" class="w-full py-2.5 bg-rose-500 text-white rounded-xl text-xs font-bold">知道啦，坐等履约 💖</button>
      </div>
    </div>

    <!-- Photo Upload Modal -->
    <div x-show="showUploadModal" x-transition.opacity class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl space-y-3">
        <h3 class="text-base font-bold text-gray-800 text-center">添加新照片 📷</h3>
        <input type="text" x-model="newPhotoTitle" placeholder="照片标题" class="w-full bg-rose-50 border border-rose-200 rounded-xl p-2 text-xs">
        <select x-model="newPhotoCategory" class="w-full bg-rose-50 border border-rose-200 rounded-xl p-2 text-xs">
          <template x-for="cat in photoCategories.filter(c => c !== '所有回忆')" :key="cat"><option :value="cat" x-text="cat"></option></template>
        </select>
        <input type="date" x-model="newPhotoDate" class="w-full bg-rose-50 border border-rose-200 rounded-xl p-2 text-xs">
        <input type="file" @change="handleImageUpload($event)" accept="image/*" class="w-full text-xs">
        <div class="flex gap-2 pt-2">
          <button @click="showUploadModal = false" class="flex-1 py-2 bg-gray-100 text-gray-600 rounded-xl text-xs font-semibold">取消</button>
          <button @click="saveNewPhoto()" class="flex-1 py-2 bg-rose-500 text-white rounded-xl text-xs font-semibold">上传</button>
        </div>
      </div>
    </div>

    <!-- Photo Lightbox -->
    <div x-show="activeLightboxPhoto" x-transition.opacity class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div @click.away="activeLightboxPhoto = null" class="w-full max-w-sm space-y-3">
        <div class="relative bg-white p-3 rounded-3xl polaroid-shadow">
          <img :src="activeLightboxPhoto?.url" class="w-full rounded-2xl max-h-[60vh] object-cover">
          <div class="pt-3 px-1 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-bold text-gray-800" x-text="activeLightboxPhoto?.title"></h3>
              <p class="text-xs text-rose-500" x-text="activeLightboxPhoto?.date + ' · ' + activeLightboxPhoto?.category"></p>
            </div>
            <button @click="triggerLoveInteraction('heart')" class="p-2 rounded-full bg-rose-50 text-rose-500"><i data-lucide="heart" class="w-5 h-5 fill-rose-500"></i></button>
          </div>
        </div>
        <button @click="activeLightboxPhoto = null" class="w-full py-2 bg-white/20 text-white rounded-xl text-xs font-medium">关闭</button>
      </div>
    </div>

  </div>

  <script>
    // 通用图像压缩上传，防止 Base64 塞爆 LocalStorage
    function resizeImage(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          let scale = 1;
          if (img.width > MAX_WIDTH) scale = MAX_WIDTH / img.width;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        }
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loveApp() {
      return {
        activeTab: 'home',
        partnerStatusText: '陪伴中的第 1000+ 天',
        anniversaryDate: localStorage.getItem('love_anniversary_date') || '2023-05-20T00:00:00',
        tempDateValue: '',
        showDateModal: false,
        timer: { totalDays: 0, hours: '00', minutes: '00', seconds: '00' },
        
        // Notifications
        showNotifModal: false,
        notifications: JSON.parse(localStorage.getItem('love_notifs')) || [],
        pushNotification(text) {
          this.notifications.unshift({ id: Date.now(), text, time: new Date().toLocaleTimeString() });
          localStorage.setItem('love_notifs', JSON.stringify(this.notifications));
        },

        // Quotes - Seeded by current date for daily rotation
        quoteIndex: 0,
        quotes: [
          "狮子的霸道遇上射手的自由，恰好是全世界最契合的温柔 ✨",
          "射手座的每一次冒险，都有狮子座的坚定守护 🦁🏹",
          "小Rae的随性洒脱，是小海胆眼里最迷人的风景 🌅",
          "当王者狮子甘愿为你低头，当风象射手愿意为你停留 💕",
          "无论天气如何，和你在一起的每一天都是晴天 ☀️",
          "宇宙中有千千万万颗星球，但我只想要你的这一颗 🌟"
        ],

        // Milestones 
        showMilestoneModal: false,
        newMsTitle: '', newMsDate: '', newMsImage: '',
        milestones: JSON.parse(localStorage.getItem('love_milestones')) || [
          { id: 1, title: '下一个周年纪念日 🎂', targetDate: '2025-05-20', icon: '🎁' }
        ],

        // Menu Data
        showMenuEditModal: false,
        activeMenuCategory: '全部',
        newCategoryName: '',
        menuCategories: JSON.parse(localStorage.getItem('love_menu_cats')) || ['全部', '专属特权', '贴心服务', '美食甜点'],
        newItem: { name: '', category: '专属特权', price: '', image: '' },
        menuItems: JSON.parse(localStorage.getItem('love_menu_items')) || [
          { id: 1, name: '无条件原谅卡 🛡️', category: '专属特权', price: '紧急时免费使用', desc: '吵架直接生效应答，对方必须无条件认错！', icon: '🛡️' },
          { id: 2, name: '肩颈舒缓按摩 15min 💆‍♀️', category: '贴心服务', price: '1个甜甜的吻', desc: '专业手法按压，附赠热敷与温柔唠嗑服务。', icon: '💆‍♀️' }
        ],

        // Food Tab
        showAddFoodModal: false,
        newFood: { name: '', price: '', image: '' },
        foodItems: JSON.parse(localStorage.getItem('love_food_items')) || [
          { id: 991, name: '双人炸鸡套餐', price_num: 88, image: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=400&q=80' }
        ],

        cart: [], showCartModal: false, showReceiptModal: false, orderNote: '',

        // Photos
        activePhotoFilter: '所有回忆',
        photoCategories: ['所有回忆', '甜蜜旅行', '日常干饭', '节日纪念'],
        photos: JSON.parse(localStorage.getItem('love_photos_data')) || [],
        showUploadModal: false, activeLightboxPhoto: null,
        newPhotoTitle: '', newPhotoCategory: '甜蜜旅行', newPhotoDate: '', newPhotoBase64: '',

        // Wishes
        wishes: JSON.parse(localStorage.getItem('love_wishes_data')) || [],
        newWishText: '',

        init() {
          this.updateTimer();
          setInterval(() => this.updateTimer(), 1000);
          this.$nextTick(() => lucide.createIcons());
        },

        switchTab(tab) {
          this.activeTab = tab;
          this.$nextTick(() => lucide.createIcons());
        },

        updateTimer() {
          const diff = new Date().getTime() - new Date(this.anniversaryDate).getTime();
          if (diff < 0) return;
          this.timer.totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
          this.timer.hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
          this.timer.minutes = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
          this.timer.seconds = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
        },
        saveAnniversaryDate() {
          if (this.tempDateValue) {
            this.anniversaryDate = this.tempDateValue + 'T00:00:00';
            localStorage.setItem('love_anniversary_date', this.anniversaryDate);
            this.showDateModal = false;
          }
        },

        calculateDaysLeft(targetStr) {
          const diff = new Date(targetStr) - new Date();
          return diff > 0 ? Math.ceil(diff / (1000 * 60 * 60 * 24)) : 0;
        },
        saveMilestones() { localStorage.setItem('love_milestones', JSON.stringify(this.milestones)); },
        handleIconUpload(e) { resizeImage(e.target.files[0], (base64) => this.newMsImage = base64); },
        addMilestone() {
          if(this.newMsTitle && this.newMsDate) {
            this.milestones.push({ id: Date.now(), title: this.newMsTitle, targetDate: this.newMsDate, image: this.newMsImage, icon: '🌟' });
            this.saveMilestones();
            this.newMsTitle = ''; this.newMsDate = ''; this.newMsImage = '';
          }
        },

        get currentQuote() {
          const day = Math.floor(new Date().getTime() / 86400000);
          return this.quotes[(day + this.quoteIndex) % this.quotes.length];
        },
        nextQuote() { this.quoteIndex++; },

        triggerLoveInteraction(type) {
          if (type === 'hug') {
            this.pushNotification("我想你了 抱抱 🫂");
          }
          if (typeof confetti === 'function') {
            confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 }, colors: ['#f43f5e', '#fda4af'] });
          }
          const container = document.getElementById('hearts-container');
          const heart = document.createElement('div');
          heart.className = 'absolute text-3xl animate-float-heart';
          heart.style.left = Math.random() * 80 + 10 + '%'; heart.style.bottom = '15%';
          heart.innerText = '💖';
          container.appendChild(heart);
          setTimeout(() => heart.remove(), 1500);
        },

        get filteredMenuItems() {
          if (this.activeMenuCategory === '全部') return this.menuItems;
          return this.menuItems.filter(i => i.category === this.activeMenuCategory);
        },
        saveMenuData() {
          localStorage.setItem('love_menu_cats', JSON.stringify(this.menuCategories));
          localStorage.setItem('love_menu_items', JSON.stringify(this.menuItems));
        },
        handleItemImageUpload(e) { resizeImage(e.target.files[0], (base64) => this.newItem.image = base64); },
        addNewMenuItem() {
          if (this.newItem.name) {
            this.menuItems.unshift({ id: Date.now(), ...this.newItem, icon: '✨' });
            this.saveMenuData();
            this.newItem = { name: '', category: this.menuCategories[0], price: '', image: '' };
          }
        },

        handleFoodImageUpload(e) { resizeImage(e.target.files[0], (base64) => this.newFood.image = base64); },
        addFoodItem() {
          if (this.newFood.name && this.newFood.price) {
            this.foodItems.unshift({ id: Date.now(), name: this.newFood.name, price_num: this.newFood.price, image: this.newFood.image });
            localStorage.setItem('love_food_items', JSON.stringify(this.foodItems));
            this.showAddFoodModal = false;
            this.newFood = { name: '', price: '', image: '' };
          }
        },

        addToCart(item) {
          const found = this.cart.find(c => c.id === item.id);
          if (found) found.qty++;
          else this.cart.push({ ...item, qty: 1 });
          this.triggerLoveInteraction('add');
        },
        updateCartQty(id, delta) {
          const found = this.cart.find(c => c.id === id);
          if (found) {
            found.qty += delta;
            if (found.qty <= 0) this.cart = this.cart.filter(c => c.id !== id);
          }
        },
        get cartTotalCount() { return this.cart.reduce((acc, cur) => acc + cur.qty, 0); },
        submitOrder() {
          this.showCartModal = false;
          this.showReceiptModal = true;
          this.pushNotification("对方发起了一个专属点单，请查看留言履约！留言: " + (this.orderNote || "无"));
          this.cart = []; this.orderNote = '';
          if (typeof confetti === 'function') confetti({ particleCount: 100, origin: { y: 0.6 } });
        },

        get filteredPhotos() {
          return this.activePhotoFilter === '所有回忆' ? this.photos : this.photos.filter(p => p.category === this.activePhotoFilter);
        },
        openLightbox(photo) { this.activeLightboxPhoto = photo; },
        handleImageUpload(e) { resizeImage(e.target.files[0], (base64) => this.newPhotoBase64 = base64); },
        saveNewPhoto() {
          if (!this.newPhotoTitle || !this.newPhotoBase64) return;
          this.photos.unshift({
            id: Date.now(), title: this.newPhotoTitle, category: this.newPhotoCategory,
            date: this.newPhotoDate || new Date().toISOString().split('T')[0], url: this.newPhotoBase64
          });
          localStorage.setItem('love_photos_data', JSON.stringify(this.photos));
          this.showUploadModal = false;
          this.newPhotoTitle = ''; this.newPhotoBase64 = '';
        },

        addWish() {
          if (!this.newWishText.trim()) return;
          this.wishes.unshift({ id: Date.now(), text: this.newWishText.trim(), completed: false });
          localStorage.setItem('love_wishes_data', JSON.stringify(this.wishes));
          this.newWishText = '';
        },
        toggleWish(id) {
          const w = this.wishes.find(item => item.id === id);
          if (w) {
            w.completed = !w.completed;
            localStorage.setItem('love_wishes_data', JSON.stringify(this.wishes));
            if (w.completed) this.triggerLoveInteraction('check');
          }
        }
      }
    }
  </script>
